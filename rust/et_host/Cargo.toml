[package]
name = "et_host"
version = "0.1.0"
edition = "2021"
# the crates rust/Cargo.lock pins need 1.88 (ureq's url and idna use icu 2.4); the workspace builds with 1.88 (checked)
rust-version = "1.88"
description = "Exhaust Tuner program in Rust (stage 2 of the move): the page's requests (OpenWAM, Engine Simulator and OpenFOAM runs, saving files, the Fusion add-in install, updates from GitHub releases), a line-for-line port of app/ExhaustTuner.Core, and exhaust-tuner-host, the same requests over stdin and stdout."
license = "GPL-3.0-only"
publish = false

[lib]
name = "et_host"
path = "src/lib.rs"

[[bin]]
name = "exhaust-tuner-host"
path = "src/bin/exhaust-tuner-host.rs"

[dependencies]
# insertion-ordered objects, so replies read like the C# program's
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
sha2 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# updates: GitHub's API and downloads (rustls, so no system TLS library is needed; the tls feature, on by default)
ureq = { version = "2", default-features = false }

[features]
default = ["tls"]
# https for the update check; off only to type-check the Windows code on another system (ring's C needs MSVC there)
tls = ["ureq/tls"]

[target.'cfg(windows)'.dependencies]
# DPAPI for the update token, as the C# program keeps it (the same entropy, so a token it saved still reads)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
