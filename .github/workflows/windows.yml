name: Windows build

# Files that do not go into the program (notes, CAD, recordings, validation runs, the OpenFOAM build) do not start
# a build; a newer push to the same branch cancels a build still running.
on:
  push:
    branches: [ "main", "windows-app" ]
    paths-ignore: [ "**/*.md", "docs/**", "cad/**", "validation/**", "layouts/**", "cfd/validation/**",
                    "tools/openfoam/**", ".github/workflows/openfoam-*.yml" ]
  pull_request:
    paths-ignore: [ "**/*.md", "docs/**", "cad/**", "validation/**", "layouts/**", "cfd/validation/**",
                    "tools/openfoam/**", ".github/workflows/openfoam-*.yml" ]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWAM_COMMIT: 25f46f2491e18e26362a428ea6dc151a195c65f0
  # every build gets its own version, so the installed programs can tell a newer release (updater.rs); builds on a PC
  # are 0.1.0 (et_host's version(), EXHAUST_TUNER_VERSION unset)
  APP_VERSION: 0.1.${{ github.run_number }}

permissions:
  contents: read
  actions: read      # to fetch the OpenFOAM build made by openfoam-windows.yml

jobs:
  # The program's tests on Linux too (rust/et_host, the request handling the window and exhaust-tuner-host share):
  # the solver-runner tests (watchdog, stop and restore, mesh warnings) use shell-script stand-ins for OpenWAM and
  # OpenFOAM and skip themselves on Windows, so without this job CI never ran them. The C# program (app/) is no
  # longer built: the Rust one replaced it in 0.1.<this run> and is checked by the same tests.
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the crates and the builds of what did not change (restored, and saved only when Cargo.lock changes)
      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            rust/target
            rust/et_core/target
          key: rust-linux-${{ hashFiles('rust/Cargo.lock', 'rust/et_core/Cargo.toml') }}-v1
          restore-keys: rust-linux-
      - name: Program tests (Linux)
        run: cargo test --release --manifest-path rust/Cargo.toml
      # Python 3.11 here: its sum() adds plainly, 3.12 and later with Neumaier's compensation, and the Rust core follows
      # whichever Python loads it; the Windows job checks it on 3.12, so both ways are covered
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # the Rust core: its own tests, then the router's tests with it loaded (the same answers as the Python router);
      # --require: a core that did not build or load fails the step instead of skipping the comparison
      - name: Rust core tests and the router on it
        run: |
          cargo test --release --manifest-path rust/et_core/Cargo.toml
          cargo build --release --manifest-path rust/et_core/Cargo.toml
          cd fusion-addin/tests
          EXHAUST_TUNER_NATIVE_DIR=$GITHUB_WORKSPACE/rust/et_core/target/release python3 test_native.py --quick --require
          EXHAUST_TUNER_NATIVE_DIR=$GITHUB_WORKSPACE/rust/et_core/target/release python3 test_router.py

  app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # the build's Python (the page builder, the CFD generator's version, the router comparison below): 3.12, whose
      # sum() adds with Neumaier's compensation as Python 3.12 and later do (core-linux checks the plain way on 3.11)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # OpenWAM from CMT-UPV's own source, unchanged, built with MinGW-w64 (its CMake files are written for GCC), and
      # only when the pinned commit is not in the cache yet: a build takes two runner minutes, a restore seconds
      - name: OpenWAM from the cache
        id: wam
        uses: actions/cache@v4
        with:
          path: engines/openwam
          key: openwam-win-x64-${{ env.OPENWAM_COMMIT }}-mingw-static-v1
      - uses: actions/checkout@v4
        if: steps.wam.outputs.cache-hit != 'true'
        with:
          repository: CMT-UPV/OpenWAM
          ref: ${{ env.OPENWAM_COMMIT }}
          path: openwam-src
      - uses: msys2/setup-msys2@v2
        if: steps.wam.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build OpenWAM (cache miss)
        if: steps.wam.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cmake -S openwam-src -B wam-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build wam-build -j 4
          exe=$(find wam-build -iname 'OpenWAM*.exe' | head -1)
          echo "built: $exe"
          mkdir -p engines/openwam
          cp "$exe" engines/openwam/OpenWAM.exe
          ldd engines/openwam/OpenWAM.exe | grep -iv -E '/c/windows|system32' || true
      - name: OpenWAM is there
        shell: pwsh
        run: |
          if (-not (Test-Path engines/openwam/OpenWAM.exe)) { throw "engines/openwam/OpenWAM.exe missing" }
          "OpenWAM $env:OPENWAM_COMMIT: " + $(if ("${{ steps.wam.outputs.cache-hit }}" -eq "true") { "from the cache" } else { "built" })
      # Engine Simulator (Arcindweld/engine-sim, private). This workflow's own token cannot read that repository, so
      # its Windows build (with the headless runner) is kept on this repository's engine-sim-build branch.
      # Refresh it after the fork changes: tools/publish_engine_sim.sh.
      - uses: actions/checkout@v4
        with:
          ref: engine-sim-build
          path: es-build
      - name: Unpack Engine Simulator build
        shell: pwsh
        run: |
          Get-Content es-build/README.txt
          Expand-Archive es-build/engine-sim-windows-x64.zip -DestinationPath es-pkg
          $exe = Get-ChildItem es-pkg -Recurse -Filter engine-sim-headless.exe | Select-Object -First 1
          if (-not $exe) { throw "the engine-sim build has no engine-sim-headless.exe" }
          New-Item -ItemType Directory -Force engines/engine-sim | Out-Null
          Copy-Item "$($exe.Directory.Parent.FullName)/*" engines/engine-sim -Recurse
          "EXHAUST_TUNER_ENGINESIM=$PWD\engines\engine-sim" >> $env:GITHUB_ENV

      # OpenFOAM: the newest build from the "OpenFOAM for Windows" workflow whose validation passed for this checkout's
      # generator and references (the 2-D square-cut-pipe cases, compressible and incompressible, against the Linux
      # v2412 runs; the 3-D snappyHexMesh path is not part of that comparison). Without one, the program ships
      # without CFD runs (the page then shows only the case download). Python (embeddable, from python.org) runs the
      # cases' own scripts: intake_report.py and, for 3-D designs, intake_cfd.py.
      - name: OpenFOAM (latest validated build) and Python for the case scripts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PY_URL: https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip
          PY_SHA256: 9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38
        run: |
          curl.exe -sSL --retry 4 -o py.zip $env:PY_URL
          if ((Get-FileHash py.zip -Algorithm SHA256).Hash -ne $env:PY_SHA256) { throw "Python embeddable package: SHA-256 mismatch" }
          Expand-Archive py.zip -DestinationPath engines/python
          "EXHAUST_TUNER_PYTHON=$PWD\engines\python\python.exe" >> $env:GITHUB_ENV
          # a passed run is not enough: its validate job itself must have passed (a skipped one does not count), and it
          # must have validated this checkout's generator version against this checkout's reference files (its
          # openfoam-validated record); otherwise the build is not bundled and the installer has no CFD runs
          $gen = python -c "import sys; sys.path.insert(0, 'cfd'); import intake_cfd; print(intake_cfd.VERSION)"
          $refs = [ordered]@{}
          foreach ($f in Get-ChildItem cfd/validation/reference/*_6000it_results.json | Sort-Object Name) {
            $refs[$f.Name] = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          }
          $run = $null
          foreach ($id in (gh run list --repo $env:GITHUB_REPOSITORY --workflow openfoam-windows.yml --status success --limit 10 --json databaseId --jq '.[].databaseId')) {
            $v = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "validate") | .conclusion'
            if ($v -ne "success") { "run ${id}: validate job '$v', not used"; continue }
            Remove-Item rec -Recurse -Force -ErrorAction SilentlyContinue
            gh run download $id --repo $env:GITHUB_REPOSITORY --name openfoam-validated --dir rec 2>$null
            if (-not (Test-Path rec/validated.json)) { "run ${id}: no validation record, not used"; continue }
            $rec = Get-Content rec/validated.json -Raw | ConvertFrom-Json
            $same = ($rec.generator -eq $gen) -and (@($rec.references.PSObject.Properties).Count -eq $refs.Count)
            foreach ($k in $refs.Keys) { if ($rec.references.$k -ne $refs[$k]) { $same = $false } }
            if (-not $same) {
              "run ${id}: validated generator $($rec.generator) with other references (this checkout: $gen), not used"; continue
            }
            "run ${id}: validated generator $gen at commit $($rec.commit)"
            $run = $id; break
          }
          $global:LASTEXITCODE = 0     # a failed download of a missing record must not fail the step
          if ($run) {
            gh run download $run --repo $env:GITHUB_REPOSITORY --name openfoam-v2412-win64 --dir ofzip
            Expand-Archive ofzip/openfoam-v2412-win64.zip -DestinationPath engines/openfoam
            "OpenFOAM from run $run"
            Get-Content engines/openfoam/OpenFOAM-v2412/SOURCE.txt -ErrorAction SilentlyContinue | Select-Object -First 8
            "EXHAUST_TUNER_OPENFOAM=$PWD\engines\openfoam\OpenFOAM-v2412" >> $env:GITHUB_ENV
            "REQUIRE_OPENFOAM=1" >> $env:GITHUB_ENV
          } else { "No OpenFOAM for Windows run validated generator $gen with these references: this installer has no CFD runs." }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            rust/target
            rust/et_core/target
          key: rust-win-${{ hashFiles('rust/Cargo.lock', 'rust/et_core/Cargo.toml') }}-v1
          restore-keys: rust-win-

      # The program (rust/: et_host, the request handling, and et_app, the window), with the C runtime linked in so the
      # two .exe files need nothing installed beside them. Its tests include the real OpenWAM against the reference run
      # made with the Linux build of the same source (cross-compiler agreement, within 0.5 %) and the update token kept
      # with DPAPI.
      - name: Program tests (real OpenWAM)
        shell: pwsh
        env:
          REQUIRE_ALL: "1"
          EXHAUST_TUNER_OPENWAM: ${{ github.workspace }}\engines\openwam\OpenWAM.exe
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo test --release --manifest-path rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the program's tests failed" }

      - name: Build the program
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          EXHAUST_TUNER_VERSION: ${{ env.APP_VERSION }}
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the program did not build" }
          $info = & rust/target/release/exhaust-tuner-host.exe --info | ConvertFrom-Json
          if ($info.version -ne $env:APP_VERSION) { throw "the built program reports version $($info.version), not $env:APP_VERSION" }
          Get-ChildItem rust/target/release/*.exe | ForEach-Object { "{0}: {1:N0} bytes" -f $_.Name, $_.Length }

      - name: Test browser from the cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-1.48.2-chromium-windows

      # The page inside the program, end to end on Windows: page + bridge + host + OpenWAM. The page's own OpenFOAM
      # run (a case to convergence, about 6 of this job's minutes) runs only when something on its path changed since
      # the last release, or when started by hand; the install step below runs a short OpenFOAM case on every build.
      - name: Page tests in the program (Windows)
        shell: pwsh
        env:
          REQUIRE_ALL: "1"
          EXHAUST_TUNER_OPENWAM: ${{ github.workspace }}\engines\openwam\OpenWAM.exe
          HOST_CLI: ${{ github.workspace }}\rust\target\release\exhaust-tuner-host.exe
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:DESKTOP_CFD = "1"
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $last = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // ""'
            if ($LASTEXITCODE -eq 0 -and $last) {
              $files = gh api "repos/$env:GITHUB_REPOSITORY/compare/$last...$env:GITHUB_SHA" --jq '.files[].filename'
              if ($LASTEXITCODE -eq 0 -and $files) {
                $hit = @($files | Where-Object { $_ -match '^(cfd/|rust/et_host/|tools/openfoam/|web/tests/desktop_ui\.js$|\.github/workflows/windows\.yml$)' })
                if ($hit.Count -eq 0) { $env:DESKTOP_CFD = "0" }
                "since $($last): $(@($files).Count) files changed, $($hit.Count) on the page's OpenFOAM path"
              }
            }
          }
          $global:LASTEXITCODE = 0
          "the page's OpenFOAM run: " + $(if ($env:DESKTOP_CFD -eq "1") { "yes" } else { "skipped (the install step still runs OpenFOAM)" })
          npm install --no-save playwright@1.48.2
          npx playwright install chromium
          node web/tests/desktop_ui.js
          # updates: the page's menu, the host's update requests (token kept with DPAPI here) and a stand-in GitHub
          node web/tests/update_ui.js

      # what the program's runs left behind (case files, postProcessing, logs) when that test failed
      - name: Keep the program test's runs (on failure)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desk-runs | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter "et-desk-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item (Join-Path $_.FullName "data") (Join-Path "desk-runs" $_.Name) -Recurse -ErrorAction SilentlyContinue }
          Get-ChildItem desk-runs -Recurse -File | Measure-Object -Sum Length | ForEach-Object { "{0} files, {1:N0} bytes" -f $_.Count, $_.Sum }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desk-runs
          path: desk-runs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage the install folder
        shell: pwsh
        run: |
          $s = "stage"
          New-Item -ItemType Directory -Force $s, "$s/web", "$s/fusion-addin", "$s/engines/openwam", "$s/licenses", "webview2" | Out-Null
          # the program: the window, and its request handling without the window (the installer runs it to install the
          # Fusion add-in; the page tests above drove it)
          Copy-Item rust/target/release/ExhaustTuner.exe, rust/target/release/exhaust-tuner-host.exe $s
          Copy-Item web/index.html "$s/web/"
          # the program opens app.html: the same page wrapped in a full HTML document (doctype, head, body), exactly as
          # the Fusion palette gets it, so it renders in standards mode like the published page
          python web/make_palette.py web/index.html "$s/web/app.html"
          if (-not (Test-Path "$s/web/app.html")) { throw "app.html was not written" }
          foreach ($f in "ExhaustTuner.py","ExhaustTuner.manifest","cadtools.py","router.py","templates.py","native.py","README.txt") { Copy-Item "fusion-addin/$f" "$s/fusion-addin/" }
          # the router's Rust core, built on this runner (the add-in falls back to its Python without it). It uses the
          # C runtime DLLs Fusion's Python already has loaded (vcruntime140, the UCRT), so its sin, cos and acos are the
          # very ones the Python router calls, and the two give the same numbers; a static runtime could differ.
          cargo build --release --manifest-path rust/et_core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the Rust core did not build" }
          # the DLL against the Python router on Windows (Fusion's Python is a Windows build too): the same answers;
          # --require fails the step when the DLL does not load, rather than skipping the comparison
          $env:EXHAUST_TUNER_NATIVE_DIR = "$PWD/rust/et_core/target/release"
          python fusion-addin/tests/test_native.py --quick --require
          if ($LASTEXITCODE -ne 0) { throw "the Rust core did not load, or does not give the Python router's answers on Windows" }
          Remove-Item Env:EXHAUST_TUNER_NATIVE_DIR
          Copy-Item rust/et_core/target/release/et_core.dll "$s/fusion-addin/"
          "et_core.dll: {0:N0} bytes" -f (Get-Item "$s/fusion-addin/et_core.dll").Length
          Copy-Item engines/openwam/OpenWAM.exe "$s/engines/openwam/"
          if (Test-Path engines/engine-sim) { Copy-Item engines/engine-sim "$s/engines/engine-sim" -Recurse; Copy-Item engines/engine-sim/LICENSE "$s/licenses/engine-sim-MIT.txt" -ErrorAction SilentlyContinue }
          if (Test-Path engines/openfoam) { Copy-Item engines/openfoam "$s/engines/openfoam" -Recurse }
          Copy-Item engines/python "$s/engines/python" -Recurse
          Copy-Item engines/python/LICENSE.txt "$s/licenses/Python-LICENSE.txt"
          Copy-Item licenses/NOTICE.txt, licenses/GPL-3.0.txt "$s/licenses/"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2/MicrosoftEdgeWebview2Setup.exe -MaximumRetryCount 4 -RetryIntervalSec 10
          Get-ChildItem $s -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "stage: {0:N1} MB in {1} files" -f ($_.Sum/1MB), $_.Count }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ env.APP_VERSION }} /DStage=..\stage installer\ExhaustTuner.iss
          Get-ChildItem dist

      # Install it silently like a user would, then drive the installed program's own host with a real OpenWAM run
      - name: Install and run from the installed folder
        shell: pwsh
        run: |
          # the installed program must find its own engines: drop the build-tree overrides earlier steps exported
          Remove-Item Env:EXHAUST_TUNER_OPENFOAM, Env:EXHAUST_TUNER_PYTHON, Env:EXHAUST_TUNER_ENGINESIM, Env:EXHAUST_TUNER_OPENWAM -ErrorAction SilentlyContinue
          $setup = Get-ChildItem dist/ExhaustTuner-Setup-*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\ET"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/TASKS=addin" -Wait
          Get-ChildItem $dir | Select-Object Name
          $info = & "$dir\exhaust-tuner-host.exe" --info | ConvertFrom-Json
          $info | ConvertTo-Json -Depth 5
          if ($info.version -ne $env:APP_VERSION) { throw "installed program reports version $($info.version), not $env:APP_VERSION" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller in the install folder: the program could not update itself" }
          if (-not $info.engines.openwam) { throw "installed program does not find OpenWAM" }
          if ($env:REQUIRE_OPENFOAM -eq "1" -and -not $info.engines.openfoam) { throw "installed program does not find OpenFOAM" }
          if ((Test-Path engines/engine-sim) -and -not $info.engines.enginesim) { throw "installed program does not find Engine Simulator" }
          if ($info.fusionAddIn.installed -ne $info.fusionAddIn.bundled) { throw "Fusion add-in not installed by the installer" }
          $wam = Get-Content app/ExhaustTuner.Core.Tests/fixtures/single450.wam -Raw
          $msg = @{ id = 1; action = "runOpenWAM"; data = @{ name = "ci"; files = @(@{ name = "single450.wam"; text = $wam }) } } | ConvertTo-Json -Depth 6 -Compress
          $out = $msg | & "$dir\exhaust-tuner-host.exe"
          $reply = $out | Where-Object { $_ -match '"ok"' } | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $reply.ok -or -not $reply.result.models[0].finished) { $out; throw "installed OpenWAM run failed" }
          "installed program ran OpenWAM: $($reply.result.models[0].seconds) s"
          if ($info.engines.openfoam) {
            # a small pipe case written by the generator with the installed Python, run by the installed OpenFOAM
            '{"name": "ci_pipe", "geometry": {"tube_diameter_mm": 60, "tube_length_mm": 300, "inlet": {"type": "plain"}, "mount": {"type": "free"}}, "operating_point": {"pressure_ratio": 1.01}, "ambient": {"p_pa": 101325, "T_c": 20}, "mesh": {"level": "coarse"}, "solver": {"force": "incompressible", "max_iterations": 150, "write_interval": 150}}' | Set-Content -Encoding ascii ci_pipe.json
            & "$dir\engines\python\python.exe" cfd/intake_cfd.py ci_pipe.json ci_pipe | Out-Null
            $files = Get-ChildItem ci_pipe -Recurse -File | ForEach-Object { @{ name = [IO.Path]::GetRelativePath("$PWD\ci_pipe", $_.FullName).Replace('\','/'); text = (Get-Content $_.FullName -Raw) } }
            $msg = @{ id = 2; action = "runOpenFOAM"; data = @{ name = "ci_pipe"; files = @($files) } } | ConvertTo-Json -Depth 6 -Compress
            $out = $msg | & "$dir\exhaust-tuner-host.exe"
            $reply = $out | Where-Object { $_ -match '"ok"' } | Select-Object -Last 1 | ConvertFrom-Json
            if (-not $reply.ok -or -not $reply.result.ok) { $out | Select-Object -Last 20; throw "installed OpenFOAM run failed" }
            "installed program ran OpenFOAM: $($reply.result.solver), $($reply.result.iterations) iterations, K $($reply.result.results.summary.K)"
          }
          # a token the C# program saved (DPAPI, its entropy) reads in the Rust program: an update from 0.1.<C#> keeps it
          $tok = "github_pat_11CSHARPSAVED0000000000_abcdefghijklmnopqrstuvwxyz0123"
          try { Add-Type -AssemblyName System.Security.Cryptography.ProtectedData -ErrorAction Stop } catch { Add-Type -AssemblyName System.Security }
          $blob = [Security.Cryptography.ProtectedData]::Protect([Text.Encoding]::UTF8.GetBytes($tok),
            [Text.Encoding]::UTF8.GetBytes("ExhaustTuner update token v1"), [Security.Cryptography.DataProtectionScope]::CurrentUser)
          $tdir = "$env:RUNNER_TEMP\tokdata"; New-Item -ItemType Directory -Force $tdir | Out-Null
          [IO.File]::WriteAllBytes("$tdir\update-token.bin", $blob)
          $env:EXHAUST_TUNER_DATA = $tdir
          $got = & "$dir\exhaust-tuner-host.exe" --token-sha256
          Remove-Item Env:EXHAUST_TUNER_DATA
          $want = [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($tok))).Replace("-", "").ToLower()
          if ($got -ne $want) { throw "a token the C# program saved does not read in the Rust program ($got)" }
          "update token saved by the C# program: reads"
          # the installed window: the page loads, its bridge reaches the request handling and the answer comes back
          # (ExhaustTuner.exe --selftest asks for hostInfo from inside the page and writes what came back)
          $st = "$env:RUNNER_TEMP\selftest.txt"; Remove-Item $st -ErrorAction SilentlyContinue
          $sp = Start-Process "$dir\ExhaustTuner.exe" -ArgumentList "--selftest", "`"$st`"" -PassThru
          if (-not $sp.WaitForExit(120000)) { $sp | Stop-Process -Force; throw "the window self-test did not finish in 2 min" }
          $res = Get-Content $st -ErrorAction SilentlyContinue | Select-Object -First 1
          "window self-test: $res (exit $($sp.ExitCode))"
          if (-not $res) { throw "the window self-test wrote nothing (exit code $($sp.ExitCode))" }
          if ($res -match '^no-webview2') { "WebView2 does not start on this runner: the window itself is not checked here" }
          elseif ($res -notmatch "^ok $([regex]::Escape($env:APP_VERSION)) desktop=true$") { throw "the window self-test failed: $res" }
          # an update the way the program runs one (updater.rs install): setup waits for the program's process to end,
          # installs over the same folder with the same tasks, and opens the program again
          $marker = "$env:LOCALAPPDATA\ExhaustTuner\last-start.txt"      # the program writes it as it starts (rust/et_app)
          function Wait-Start([int]$sec) { for ($i = 0; $i -lt $sec; $i++) { if (Test-Path $marker) { return @(Get-Content $marker) }; Start-Sleep 1 }; return $null }
          # can this machine start the window at all? (a runner without a desktop session may not)
          Remove-Item $marker -ErrorAction SilentlyContinue
          $t0 = Get-Date
          $direct = Start-Process "$dir\ExhaustTuner.exe" -PassThru
          $seenDirect = Wait-Start 30
          "started directly: " + $(if ($seenDirect) { "recorded $($seenDirect[0]) from $($seenDirect[3])" } else { "no start recorded in 30 s; exited: $($direct.HasExited)" + $(if ($direct.HasExited) { ", code $($direct.ExitCode)" } else { "" }) })
          if ($seenDirect) {
            # the window then loads the page in WebView2 and adds a line when it has (rust/et_app)
            for ($i = 0; $i -lt 45 -and -not ((Get-Content $marker -ErrorAction SilentlyContinue) -match '^page loaded'); $i++) { Start-Sleep 1 }
            $page = @(Get-Content $marker -ErrorAction SilentlyContinue) -match '^page'
            "window: " + $(if ($page) { $page[-1] } else { "no page line in 45 s (WebView2 may not run on this machine)" }) + "; running: $(-not $direct.HasExited)"
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $t0 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'ExhaustTuner' } | Select-Object -First 3 | ForEach-Object { "event: $($_.ProviderName): " + ($_.Message -split "`n" | Select-Object -First 6) -join ' ' }
          $direct | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -ErrorAction SilentlyContinue
          $prog = Start-Process pwsh -ArgumentList "-NoProfile", "-Command", "Start-Sleep -Seconds 8" -PassThru
          $t0 = Get-Date
          $p = Start-Process $setup.FullName -PassThru -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/CURRENTUSER",
            "/RELAUNCH=1","/WAITPID=$($prog.Id)","/MERGETASKS=addin","/LOG=`"$env:RUNNER_TEMP\update.log`""
          $p.WaitForExit()
          $took = ((Get-Date) - $t0).TotalSeconds
          if (-not $prog.HasExited) { throw "the update finished while the program it waits for was still running" }
          if ($took -lt 7) { throw "setup finished after $([math]::Round($took, 1)) s: it did not wait for the program (8 s)" }
          # reopened: setup's log has the reopen entry after the install, and where this machine can start the window at
          # all, the program itself records the start (version, process id, time, folder)
          $log = Get-Content "$env:RUNNER_TEMP\update.log" -Raw
          $entry = $log -match "(?s)Installation process succeeded\..*-- Run entry --\s+[^\r\n]*Run as: Original user\s+[^\r\n]*Type: Exec\s+[^\r\n]*Filename: [^\r\n]*\\ExhaustTuner\.exe"
          if (-not $entry) { Get-Content "$env:RUNNER_TEMP\update.log" -Tail 40; throw "setup's log has no entry reopening the program after the update" }
          $seen = Wait-Start 40
          if ($seenDirect) {
            if (-not $seen) { throw "setup did not open the program again after the update (it starts when run directly)" }
            if ($seen[0] -ne $env:APP_VERSION -or -not $seen[3].StartsWith($dir)) { throw "the program that started is not the updated one: $($seen -join ' | ')" }
            "update: setup waited for the program, ended after $([math]::Round($took, 1)) s and opened it again: $($seen[0]) from $($seen[3]), process $($seen[1])"
            Get-Process -Id $seen[1] -ErrorAction SilentlyContinue | Stop-Process -Force
          } else {
            "update: setup waited for the program, ended after $([math]::Round($took, 1)) s and ran its reopen entry; this machine cannot start the window (not even directly), so the start itself is not checked here"
          }
          $info2 = & "$dir\exhaust-tuner-host.exe" --info | ConvertFrom-Json
          if ($info2.fusionAddIn.installed -ne $info2.fusionAddIn.bundled) { throw "the update did not keep the Fusion add-in installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ExhaustTuner-Setup
          path: dist/ExhaustTuner-Setup-*.exe
          retention-days: 30

  # A push to the program branch that passed everything above becomes release v<APP_VERSION> with the installer and
  # SHA256SUMS.txt; the notes list the commits since the previous release. The installed program checks the newest
  # release and offers it (rust/et_host/src/updater.rs). The newest 6 releases are kept. The program branch is
  # windows-app (the condition below).
  release:
    needs: [ core-linux, app ]
    if: github.ref_name == 'windows-app' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ExhaustTuner-Setup
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"; setup="ExhaustTuner-Setup-$APP_VERSION.exe"
          [ -f "dist/$setup" ] || { ls -l dist; echo "dist/$setup missing"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists already (a re-run)"; exit 0; fi
          (cd dist && sha256sum "$setup" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          {
            echo "Built from ${GITHUB_SHA::7} on $GITHUB_REF_NAME ($(date -u +%Y-%m-%d))."
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              echo "Changes since $prev:"
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA" | head -80 || true
            else
              echo "Recent changes:"
              git log --no-merges --format='- %s' -25 "$GITHUB_SHA" || true
            fi
          } > notes.md
          cat notes.md
          gh release create "$tag" "dist/$setup" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Exhaust Tuner $APP_VERSION" --notes-file notes.md
          # withdrawn releases (installer/withdrawn.txt: tag, reason) become pre-releases, which the program skips
          grep -v '^[[:space:]]*#' installer/withdrawn.txt | while read -r t why; do
            [ -n "$t" ] || continue
            if gh release view "$t" >/dev/null 2>&1; then
              gh release edit "$t" --prerelease --title "Exhaust Tuner ${t#v} (withdrawn: $why)" >/dev/null && echo "withdrew $t: $why"
            fi
          done
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].tagName' |
            while read -r old; do echo "removing $old"; gh release delete "$old" --cleanup-tag --yes; done
