name: OpenFOAM on Windows (probe)

# Finds out what ESI's native Windows (MinGW) OpenFOAM build contains and runs the Blair & Cahoon
# square-cut-pipe validation case with it, to decide how the program bundles CFD.
on:
  push:
    branches: [ "windows-app" ]
    paths: [ ".github/workflows/openfoam-probe.yml" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download the v2412 Windows build and unpack it without running its installer UI
        shell: pwsh
        timeout-minutes: 30
        run: |
          # dl.openfoam.com hands the file to SourceForge; its mirror redirect serves the binary to curl
          curl.exe -sSL --retry 3 -A "Wget/1.21" -o of.exe "https://downloads.sourceforge.net/project/openfoam/v2412/OpenFOAM-v2412-windows-mingw.exe"
          "{0:N1} MB" -f ((Get-Item of.exe).Length/1MB)
          # which installer is it? (the last run's "/S /D=" silent switches left it waiting for 90 minutes)
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\of.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min($bytes.Length, 4MB))
          foreach ($sig in "Inno Setup","Nullsoft","NSIS","7-Zip","7zS","InstallShield","WiX","Squirrel","msys2","MSYS2","Qt Installer") {
            if ($text.Contains($sig)) { "signature: $sig" }
          }
          & "C:\Program Files\7-Zip\7z.exe" l of.exe | Select-Object -First 30
          New-Item -ItemType Directory -Force C:\OF | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x of.exe -oC:\OF -y | Select-Object -Last 5
          # the NSIS installer carries the whole MSYS2 tree (OpenFOAM inside it) as msys64.7z, plus the env .bat files
          & "C:\Program Files\7-Zip\7z.exe" x C:\OF\msys64.7z -oC:\OF -y | Select-Object -Last 3
          foreach ($f in "setEnvVariables-v2412.bat","OpenFOAM-MSYS2.bat","OpenFOAM-MS-DOSPrompt.bat","README.txt") { "==== $f"; Get-Content "C:\OF\$f" }
          $global:LASTEXITCODE = 0
          Get-ChildItem C:\OF -Depth 2 | Select-Object -First 40 FullName
      - name: What is inside
        shell: pwsh
        run: |
          foreach ($n in "bash.exe","blockMesh.exe","snappyHexMesh.exe","surfaceFeatureExtract.exe","checkMesh.exe","topoSet.exe","foamDictionary.exe","rhoSimpleFoam.exe","simpleFoam.exe","decomposePar.exe","reconstructPar.exe","mpiexec.exe","python.exe","python3.exe","sed.exe","grep.exe") {
            $f = Get-ChildItem C:\OF -Recurse -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
            "{0,-28} {1}" -f $n, ($f.FullName)
          }
          Get-ChildItem C:\OF -Recurse -Include *.bat,bashrc -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          $b = Get-ChildItem C:\OF -Recurse -Filter *.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($b) { "---- $($b.FullName)"; Get-Content $b.FullName }
          $du = (Get-ChildItem C:\OF -Recurse -File | Measure-Object Length -Sum).Sum
          "installed size: {0:N0} MB" -f ($du/1MB)
      - name: Run the square-cut-pipe validation case (Windows tools called directly, no bash)
        shell: pwsh
        timeout-minutes: 60
        env:
          INTAKE_CFD_STAMP: "probe"
        run: |
          $ErrorActionPreference = "Continue"
          $of = "C:\OF\msys64\home\ofuser\OpenFOAM\OpenFOAM-v2412"; $type = "win64MingwDPInt32Opt"
          "platform folders:"; Get-ChildItem "$of\platforms\$type" -Directory | Select-Object -ExpandProperty Name
          # every folder holding DLLs under the OpenFOAM tree (OpenFOAM libraries, third party, MinGW runtime)
          $dllDirs = Get-ChildItem "C:\OF\msys64\home\ofuser\OpenFOAM" -Recurse -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique
          "DLL folders:"; $dllDirs
          $mpi = $dllDirs | Where-Object { $_ -match '\\(mpi|msmpi|openmpi)' }
          $dllDirs = @($dllDirs | Where-Object { $_ -notmatch '\\(mpi|msmpi|openmpi)' })   # serial run: the dummy Pstream, not MS-MPI
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          # which DLLs each piece needs, and where (if anywhere) the package has them
          $need = @{}
          foreach ($f in "blockMesh.exe","libPstream.dll","libOpenFOAM.dll","rhoSimpleFoam.exe") {
            $deps = & $dumpbin.FullName /dependents "$of\platforms\$type\bin\$f" | Select-String "^\s+(\S+\.dll)\s*$" | ForEach-Object { $_.Matches[0].Groups[1].Value }
            "$f -> $($deps -join ', ')"
            foreach ($d in $deps) { $need[$d] = 1 }
          }
          $runtimeDirs = @()
          foreach ($d in $need.Keys) {
            if (Test-Path "$of\platforms\$type\bin\$d") { continue }
            $hit = Get-ChildItem C:\OF -Recurse -Filter $d -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
            "{0,-28} {1}" -f $d, (($hit -join ' | ') -replace '^$','(not in the package)')
            foreach ($h in $hit) { if ($h -notmatch '\\usr\\') { $runtimeDirs += (Split-Path $h) } }
          }
          $dllDirs = @($dllDirs) + @($runtimeDirs | Select-Object -Unique)
          "PATH additions: $($dllDirs -join '; ')"
          $ErrorActionPreference = "Stop"
          $env:WM_PROJECT = "OpenFOAM"; $env:WM_PROJECT_VERSION = "v2412"; $env:WM_PROJECT_DIR = $of; $env:FOAM_SIGFPE = "1"
          $env:PATH = ((@("$of\platforms\$type\bin") + $dllDirs + @($env:PATH)) -join ';')
          python cfd/intake_cfd.py cfd/tests/pp.json case_pp | Out-Null
          Push-Location case_pp
          function Step($exe, $log) { & $exe *> $log; "{0,-16} exit {1}" -f $exe, $LASTEXITCODE; if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 25; throw "$exe failed" } }
          Step blockMesh log.blockMesh
          Step checkMesh log.checkMesh
          Step topoSet log.topoSet
          $solver = (Select-String -Path system/controlDict -Pattern '^application\s+(\S+);').Matches[0].Groups[1].Value
          $t0 = Get-Date
          Step $solver "log.$solver"
          "solver time: {0:N0} s" -f ((Get-Date) - $t0).TotalSeconds
          python intake_report.py *> log.report; "report exit $LASTEXITCODE"; Get-Content log.report -Tail 15
          Pop-Location
          if (Test-Path case_pp/results.json) { Get-Content case_pp/results.json -Raw } else { throw "no results.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfoam-probe-case
          path: |
            case_pp/log.*
            case_pp/results.json
            case_pp/results.txt
